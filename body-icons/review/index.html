<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Body part icons</title>
  <style>
    body {
      margin: 24px;
      background: #f4f6fb;
      color: #1e2a4a;
      font: 14px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    figure {
      margin: 0;
      padding: 12px;
      background: white;
      border: 2px solid #1e2a4a;
      border-radius: 12px;
    }
    figcaption { font-weight: 700; margin-bottom: 10px; }
    .sizes { display: flex; align-items: end; gap: 16px; }
    img { display: block; }
  </style>
</head>
<body>
  <h1>Body part icons</h1>
  <div class="grid" id="grid"></div>
  <script>
    const names = [
      'head', 'neck', 'shoulders', 'chest', 'upper-back', 'arms', 'wrists',
      'hands', 'core', 'lower-back', 'hips', 'thighs', 'knees', 'calves',
      'ankles', 'feet', 'whole-body', 'other',
    ];
    const grid = document.getElementById('grid');
    for (const name of names) {
      const figure = document.createElement('figure');
      const caption = document.createElement('figcaption');
      caption.textContent = name;
      const sizes = document.createElement('div');
      sizes.className = 'sizes';
      for (const size of [32, 64, 128]) {
        const img = document.createElement('img');
        img.src = `../${name}.svg`;
        img.width = size;
        img.height = size;
        img.alt = name;
        sizes.append(img);
      }
      figure.append(caption, sizes);
      grid.append(figure);
    }
  </script>
</body>
</html>
